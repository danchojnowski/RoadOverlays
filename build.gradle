plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

import groovy.json.JsonOutput
import java.awt.BasicStroke
import java.awt.Color
import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def paintCatalogFile = file('src/main/resources/paint_catalog.tsv')
def generatedPaintResources = layout.buildDirectory.dir('generated/paint_resources')

tasks.register('generatePaintResources') {
    inputs.file(paintCatalogFile)
    outputs.dir(generatedPaintResources)
    doLast {
        def root = generatedPaintResources.get().asFile
        delete(root)
        def colors = ['white', 'orange', 'magenta', 'light_blue', 'yellow', 'lime', 'pink', 'gray',
                      'light_gray', 'cyan', 'purple', 'blue', 'brown', 'green', 'red', 'black']
        def names = [
                'itemGroup.roadoverlays': 'Road Overlays',
                'tooltip.roadoverlays.curve_radius': 'Radius: %s blocks',
                'tooltip.roadoverlays.curve_controls': 'Right-click without placing to open settings. Sneak while placing to turn left.',
                'tooltip.roadoverlays.line_angle': 'Angle: %s°',
                'tooltip.roadoverlays.line_controls': 'Right-click without placing to open angle settings.',
                'gui.roadoverlays.curve_title': 'Curve Radius',
                'gui.roadoverlays.angle_title': 'Diagonal Angle',
                'gui.roadoverlays.curve_value': 'Radius: %s blocks',
                'gui.roadoverlays.angle_value': 'Angle: %s°',
                'item.roadoverlays.paint_applicator': 'Paint Applicator',
                'gui.roadoverlays.applicator_title': 'Paint Applicator Pattern',
                'gui.roadoverlays.applicator_place': 'Place %s blocks',
                'gui.roadoverlays.applicator_skip': 'Skip %s blocks',
                'tooltip.roadoverlays.applicator_pattern': 'Place %s, skip %s',
                'tooltip.roadoverlays.applicator_use': 'Carries paint from your inventory. Offhand selects the type. Click start and end blocks.',
                'message.roadoverlays.applicator_inventory': 'Carry a road line paint in your inventory.',
                'message.roadoverlays.applicator_start': 'Start selected. Click an end block; click the start again to cancel.',
                'message.roadoverlays.applicator_cancel': 'Paint run cancelled.',
                'message.roadoverlays.applicator_height': 'Start and end must be at the same block height.',
                'message.roadoverlays.applicator_placed': 'Placed %s paint blocks.'
        ]
        def writeJson = { String path, Object value ->
            def target = new File(root, path)
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n'
        }
        def drawAngledLine = { texture, style, angleDegrees, canvasSize ->
            int size = canvasSize as int
            def image = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
            def graphics = image.createGraphics()
            graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            graphics.setColor(Color.WHITE)
            int stripeWidth = style.contains('thick') ? 16 : 8
            graphics.setStroke(new BasicStroke(stripeWidth, BasicStroke.CAP_BUTT, BasicStroke.JOIN_BEVEL))
            double angle = Math.toRadians(angleDegrees as double)
            double dx = Math.sin(angle)
            double dy = Math.cos(angle)
            double nx = Math.cos(angle)
            double ny = -Math.sin(angle)
            def offsets = style.startsWith('double')
                    ? (style == 'double_thick' ? [-12d, 12d] : [-8d, 8d]) : [0d]
            offsets.each { offset ->
                double x = size / 2d + nx * offset
                double y = size / 2d + ny * offset
                graphics.drawLine((int) Math.round(x - dx * size), (int) Math.round(y - dy * size),
                        (int) Math.round(x + dx * size), (int) Math.round(y + dy * size))
            }
            graphics.dispose()
            def target = new File(root, "assets/roadoverlays/textures/block/${texture}.png")
            target.parentFile.mkdirs()
            ImageIO.write(image, 'png', target)
        }
        def drawCurvedLine = { texture, style ->
            int size = 64
            def image = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
            def graphics = image.createGraphics()
            graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            graphics.setColor(Color.WHITE)
            int stripeWidth = style.contains('thick') ? 16 : 8
            graphics.setStroke(new BasicStroke(stripeWidth, BasicStroke.CAP_BUTT, BasicStroke.JOIN_BEVEL))
            def offsets = style.startsWith('double')
                    ? (style == 'double_thick' ? [-12d, 12d] : [-8d, 8d]) : [0d]
            offsets.each { offset ->
                double radius = 50 + offset
                def path = new java.awt.geom.Path2D.Double()
                for (int i = 0; i <= 64; i++) {
                    double angle = Math.PI + Math.PI * i / 128
                    double x = 58 + Math.cos(angle) * radius
                    double y = 58 + Math.sin(angle) * radius
                    if (i == 0) path.moveTo(x, y)
                    else path.lineTo(x, y)
                }
                graphics.draw(path)
            }
            graphics.dispose()
            def target = new File(root, "assets/roadoverlays/textures/block/${texture}.png")
            target.parentFile.mkdirs()
            ImageIO.write(image, 'png', target)
        }
        paintCatalogFile.readLines('UTF-8').findAll { it && !it.startsWith('#') }.each { row ->
            def fields = row.split('\t', -1)
            def (id, texture, displayName, recipe) = fields[0..3]
            if (id == 'road_line') return
            if (recipe.length() != 9 || !recipe.contains('L')) {
                throw new GradleException("Invalid recipe for ${id}")
            }
            def sourceLine = fields.length > 5 && fields[5] ? fields[5] : 'road_line'
            def adjustable = id =~ /^angled_line_(single|double|thick|double_thick)$/
            if (adjustable.matches()) drawAngledLine(texture, adjustable[0][1], 45, 64)
            def curved = id =~ /^curved_line_(single|double|thick|double_thick)$/
            if (curved.matches()) drawCurvedLine(texture, curved[0][1])
            writeJson("assets/roadoverlays/models/block/${id}.json", [
                    render_type: 'minecraft:cutout', ambientocclusion: false,
                    textures: [paint: "roadoverlays:block/${texture}",
                               particle: "roadoverlays:block/${texture}"],
                    elements: [[from: [0, 0, 0], to: [16, 1, 16],
                                faces: [up: [texture: '#paint', tintindex: 0]]]]
            ])
            colors.each { color ->
                def fullId = "${color}_${id}"
                names["block.roadoverlays.${fullId}"] = "${color.replace('_', ' ').split(' ')*.capitalize().join(' ')} ${displayName}"
                writeJson("assets/roadoverlays/blockstates/${fullId}.json",
                        [variants: ['': [model: "roadoverlays:block/${id}"]]])
                writeJson("assets/roadoverlays/models/item/${fullId}.json",
                        [parent: 'minecraft:item/generated', textures: [layer0: "roadoverlays:block/${texture}"]])
                def ingredients = [L: [item: "roadoverlays:${color}_${sourceLine}"]]
                if (recipe.contains('D')) ingredients.D = [item: "minecraft:${color}_dye"]
                writeJson("data/roadoverlays/recipe/${fullId}.json", [
                        type: 'minecraft:crafting_shaped', category: 'building',
                        pattern: [recipe[0..2], recipe[3..5], recipe[6..8]].collect { it.replace('.', ' ') },
                        key: ingredients,
                        result: [id: "roadoverlays:${fullId}", count: id.contains('line') ? 6 : 1]
                ])
            }
        }
        colors.each { color ->
            names["block.roadoverlays.${color}_road_line"] =
                    "${color.replace('_', ' ').split(' ')*.capitalize().join(' ')} Road Line"
        }
        writeJson('assets/roadoverlays/lang/en_us.json', names)
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generatePaintResources')
    from(generatedPaintResources)
    from('assets') {
        into 'assets'
    }
    from('assets/roadoverlays/textures/paints') {
        into 'assets/roadoverlays/textures/block'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        roadoverlays {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
